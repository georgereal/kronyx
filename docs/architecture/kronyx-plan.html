<script>DSRun("\nconst groups = [\n  { id: \"vscode\", label: \"VS Code extension (thin shell)\" },\n  { id: \"core\", label: \"Kronyx core (headless, reusable in CLI and microVM)\" },\n  { id: \"infra\", label: \"Stores, sandboxes and external services\" },\n];\nconst nodes = [\n  { id: \"ui\", group: \"vscode\", title: \"Webview UI\", sub: \"chat, runs, tools\",\n    detail: \"React webview: chat, plan view, run timeline with per-step status, cost and token meter, comment threads, buttons to run lint, test and build on demand.\" },\n  { id: \"native\", group: \"vscode\", title: \"Native surfaces\", sub: \"diff, Problems, comments\",\n    detail: \"Use VS Code's own diff editor for hunk-level accept and reject, the Problems panel for check results, CommentController for inline review comments, a TreeView of runs, and terminal shell integration to capture command output.\" },\n  { id: \"orch\", group: \"core\", title: \"Agent orchestrator\", sub: \"plan > act > verify\",\n    detail: \"Built on the Cline SDK (@cline/agents and @cline/core). Explicit state machine (not a free-running loop): plan, act through tools, verify with checks, reflect and retry. Writes a git checkpoint before each edit batch so any step can be rolled back. Applies the approval policy per tool tier.\" },\n  { id: \"gw\", group: \"core\", title: \"Model gateway\", sub: \"custom AI APIs\",\n    detail: \"Adapters for OpenAI-compatible, Anthropic, Azure, Bedrock and self-hosted (Ollama, vLLM) endpoints. Each model gets a capability profile: context size, native tool calling or XML fallback, preferred edit format, cost. Lets you route planning to a strong model and edits or summaries to a cheap one.\" },\n  { id: \"ctx\", group: \"core\", title: \"Context engine\", sub: \"read + retrieve\",\n    detail: \"tree-sitter parsing for outlines and a symbol graph, ripgrep for exact search, VS Code LSP commands for definitions and references, an Aider-style ranked repo map, hybrid BM25 + embedding retriev Resolve the edit with the model's preferred strategy, falling back down the list\",\n  \"Parse the result with tree-sitter; reject edits that introduce syntax errors\",\n  \"Run the formatter, then compare LSP diagnostics before and after\",\n  \"On failure return a structured error with the current snippet, so the retry is grounded\",\n  \"Record strategy, model and outcome so the per-model profile learns which format works\",\n];\nconst readTools = [\"read_file (ranges, line numbers, anchors)\", \"outline (symbols per file)\", \"search (ripgrep, regex)\", \"semantic_search (hybrid + rerank)\", \"find_definition / find_references (LSP)\", \"repo_map (ranked overview)\", \"list_changed (git status and diff)\"];\n\nconst memoryTiers = [\n  { tier: \"Working context\", scope: \"One run\", store: \"In memory\", feeds: \"Compaction summaries when the window fills\" },\n  { tier: \"Rules\", scope: \"Repo or user\", store: \".kronyx/rules.md (in git)\", feeds: \"Written by people; always in the prompt\" },\n  { tier: \"Project facts\", scope: \"Repo\", store: \".kronyx/memory + SQLite\", feeds: \"Extracted from runs and corrections; the user approves before saving\" },\n  { tier: \"Code index (RAG)\", scope: \"Repo\", store: \"LanceDB + symbol graph\", feeds: \"Chunks by symbol, hybrid search, incremental re-index on save\" },\n  { tier: \"Episodes\", scope: \"Repo or team\", store: \"SQLite trajectories\", feeds: \"Past task, plan, diff, check results and feedback; retrieved as worked examples for similar tasks\" },\n  { tier: \"Model weights\", scope: \"Org\", store: \"Fine-tuned open-weights models\", feeds: \"Later: LoRA / DPO on accumulated episodes and feedback\" },\n];\n\nconst checks = [\n  { kind: \"Format\", examples: \"Prettier, Black, gofmt, rustfmt\", when: \"After every edit\" },\n  { kind: \"Lint\", examples: \"ESLint, Ruff, golangci-lint, Clippy\", when: \"After every edit batch (changed files only)\" },\n  { kind: \"Type check\", examples: \"tsc, Pyright
